name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # A test file missing from the target runs nothing and still reports
      # success, so check membership before trusting a green suite.
      - name: Check test target membership
        run: ./scripts/check-test-membership.sh

      # The `a-bar` scheme builds the app target for testing, so this compiles
      # the whole app before the bundle. There is no signing identity on a runner.
      - name: Run tests
        run: |
          xcodebuild test \
            -project a-bar.xcodeproj \
            -scheme a-bar \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate badges
        if: github.event_name == 'push'
        run: ./scripts/generate-badges.sh "$RUNNER_TEMP/TestResults.xcresult" "$RUNNER_TEMP/badges"

      - name: Save badges
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: ${{ runner.temp }}/badges/*.svg

  publish-badges:
    name: Publish badges
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: badges
          path: ${{ runner.temp }}/badges

      - name: Publish badges
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan badges
          git rm -rf .
          cp "$RUNNER_TEMP/badges/"*.svg .
          git add coverage.svg version.svg
          git commit -m "Update README badges"
          git push --force origin badges
